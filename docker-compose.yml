
services:
  api:
    build: .
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HF_HOME: /cache/huggingface
    volumes:
      - ./data:/app/data
      - hf_cache:/cache/huggingface
    restart: unless-stopped

  dashboard:
    build: .
    command: >
      streamlit run dashboard.py
      --server.address 0.0.0.0
      --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  hf_cache:
